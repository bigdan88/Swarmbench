<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harness test fixture</title>
<style>
body { font: 16px system-ui; margin: 24px auto; padding: 16px; max-width: 640px; }
input[type=text] { box-sizing: border-box; width: 100%; padding: 12px; }
button { padding: 10px; margin: 4px; } li { display: flex; align-items: center; gap: 8px; margin: 12px 0; }
li span { flex: 1; overflow-wrap: anywhere; min-width: 0; } ul { padding: 0; }
</style>
<h1>Tasks</h1>
<form><label for="task">New task</label><input id="task" type="text" required><button>Add task</button></form>
<nav aria-label="Task filters"><button>All</button><button>Active</button><button>Completed</button></nav>
<ul></ul><p id="empty">No tasks here. Add one above.</p>
<script>
let tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
let filter = 'All';
function render() {
  localStorage.setItem('tasks', JSON.stringify(tasks));
  const list = document.querySelector('ul'); list.replaceChildren();
  for (const task of tasks.filter(t => filter === 'All' || (filter === 'Completed' ? t.done : !t.done))) {
    const row = document.createElement('li');
    const checkbox = document.createElement('input'); checkbox.type = 'checkbox'; checkbox.checked = task.done;
    checkbox.setAttribute('aria-label', 'Complete ' + task.text);
    checkbox.onchange = () => { task.done = checkbox.checked; render(); };
    const text = document.createElement('span'); text.textContent = task.text;
    const remove = document.createElement('button'); remove.textContent = 'Delete';
    remove.onclick = () => { tasks = tasks.filter(t => t !== task); render(); };
    row.append(checkbox, text, remove); list.append(row);
  }
  document.querySelector('#empty').hidden = list.children.length > 0;
}
document.querySelector('form').onsubmit = event => {
  event.preventDefault(); const input = document.querySelector('#task');
  if (input.value.trim()) tasks.push({ text: input.value.trim(), done: false });
  input.value = ''; render();
};
document.querySelectorAll('nav button').forEach(button => button.onclick = () => { filter = button.textContent; render(); });
render();
</script>
</html>
